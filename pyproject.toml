[project]
name = "sfda"
version = "0.1.0"
description = "Simple fastapi docker app"
authors = [{ name = "alfrice", email = "vinsanau@gmail.com" }]
requires-python = ">=3.12"
dependencies = ["fastapi (>=0.137.1,<0.138.0)", "uvicorn (>=0.49.0,<0.50.0)"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
